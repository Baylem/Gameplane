name: dev containers

# Verifies the modular dev containers (spec 026).
#
# drift: regenerated files must match their inputs, and the generator's fixture
#        tests must pass.
# build: builds the full profile on amd64 and arm64 and runs its checks inside
#        the container. PR-A: full profile only; PR-B (T021) adds the
#        affected-profile matrix.
on:
  pull_request:
    paths:
      - '.devcontainer/**'
      - '**/system-deps.toml'
      - 'hack/gen-devcontainers.py'
      - 'hack/test-gen-devcontainers.py'
      - 'hack/need.sh'
      - 'Makefile'
      - 'go.work'
      - 'web/package*.json'
      - '.github/workflows/devcontainers.yaml'
  push:
    branches: [master]
    paths:
      - '.devcontainer/**'
      - '**/system-deps.toml'
      - 'hack/gen-devcontainers.py'
      - 'hack/test-gen-devcontainers.py'
      - 'hack/need.sh'
      - 'Makefile'
      - 'go.work'
      - 'web/package*.json'
      - '.github/workflows/devcontainers.yaml'

permissions:
  contents: read

concurrency:
  group: devcontainers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    name: drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Verify generated dev container files
        run: python3 hack/gen-devcontainers.py --check

      - name: Run generator fixture tests
        run: make test-gen-devcontainers

  build:
    name: build (${{ matrix.arch }})
    needs: drift
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Record start time
        id: timer
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Expand full profile checks
        id: checks
        run: |
          set -euo pipefail
          cmd="$(python3 hack/gen-devcontainers.py --checks full)"
          echo "cmd=${cmd}" >> "$GITHUB_OUTPUT"

      - name: Build full profile and run its checks
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          push: never
          configFile: .devcontainer/devcontainer.json
          runCmd: ${{ steps.checks.outputs.cmd }}

      - name: Write build summary
        if: always() && steps.timer.outcome == 'success'
        env:
          STARTED: ${{ steps.timer.outputs.started }}
          MATRIX_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          elapsed=$(( $(date +%s) - STARTED ))
          {
            echo "### Dev containers: full (${MATRIX_ARCH})"
            echo ""
            echo "- Setup seconds: ${elapsed}"
            echo "- Workspace size (du -sx): $(du -sx "$GITHUB_WORKSPACE" | cut -f1) KiB"
            echo ""
            echo "Docker images:"
            echo ""
            echo '```'
            docker image ls --format '{{.Repository}}:{{.Tag}} {{.Size}}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
