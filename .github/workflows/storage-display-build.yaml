name: storage display build-only

# Review artifacts only. Tests run independently in ci.yaml; this workflow
# neither publishes registry images nor authorizes a production deployment.
on:
  pull_request:
    branches: [review/v0.4.1-storage-base]
    paths:
      - api/**
      - web/**
      - netguard/**
      - gameaction/**
      - gp-module/**
      - telemetryschema/**
      - i18n/**
      - .dockerignore
      - .github/workflows/storage-display-build.yaml

permissions:
  contents: read

concurrency:
  group: storage-display-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  build:
    name: OCI archive (${{ matrix.component }}, amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        component: [api, web]
    steps:
      # Build the same PR merge SHA that normal pull-request CI tests.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: prepare artifact directory and version
        id: prepare
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/storage-display"
          printf 'version=0.4.1-storage-%s\n' "${SOURCE_SHA:0:7}" >> "$GITHUB_OUTPUT"
      - name: build production image without pushing
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.component }}/Dockerfile
          platforms: linux/amd64
          push: false
          load: false
          outputs: type=oci,dest=${{ runner.temp }}/storage-display/${{ matrix.component }}.oci.tar
          build-args: |
            VERSION=${{ steps.prepare.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.prepare.outputs.version }}
          provenance: mode=min
      - name: record archive checksum and OCI descriptors
        env:
          COMPONENT: ${{ matrix.component }}
          SOURCE_SHA: ${{ github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          BUILD_DIGEST: ${{ steps.image.outputs.digest }}
          BUILD_VERSION: ${{ steps.prepare.outputs.version }}
        shell: python
        run: |
          import hashlib
          import json
          import os
          import pathlib
          import tarfile

          component = os.environ["COMPONENT"]
          directory = pathlib.Path(os.environ["RUNNER_TEMP"]) / "storage-display"
          archive = directory / f"{component}.oci.tar"
          with archive.open("rb") as stream:
              checksum = hashlib.file_digest(stream, "sha256").hexdigest()
          with tarfile.open(archive) as layout:
              index_member = next(
                  member for member in layout.getmembers()
                  if member.name.removeprefix("./") == "index.json"
              )
              index_stream = layout.extractfile(index_member)
              if index_stream is None:
                  raise RuntimeError("OCI index is not a regular file")
              index = json.load(index_stream)
          descriptors = index.get("manifests", [])
          if not descriptors:
              raise RuntimeError("OCI archive has no image descriptors")
          metadata = {
              "component": component,
              "platform": "linux/amd64",
              "sourceRepository": os.environ["REPOSITORY"],
              "sourceMergeSha": os.environ["SOURCE_SHA"],
              "pullRequestHeadSha": os.environ["HEAD_SHA"],
              "pullRequestBaseSha": os.environ["BASE_SHA"],
              "buildVersion": os.environ["BUILD_VERSION"],
              "buildDigest": os.environ["BUILD_DIGEST"],
              "ociDescriptors": descriptors,
              "archiveSha256": checksum,
              "dockerfileSha256": hashlib.sha256(
                  pathlib.Path(component, "Dockerfile").read_bytes()
              ).hexdigest(),
              "runId": os.environ["RUN_ID"],
              "runAttempt": os.environ["RUN_ATTEMPT"],
              "registryPublished": False,
              "signed": False,
          }
          (directory / f"{component}.metadata.json").write_text(
              json.dumps(metadata, indent=2) + "\n"
          )
          (directory / f"{component}.oci.tar.sha256").write_text(
              f"{checksum}  {archive.name}\n"
          )
      - name: install checksum-pinned Trivy 0.74.0
        uses: ./.github/actions/install-trivy
      # Trivy 0.74 reads OCI directories, not OCI tar archives. Extract only
      # regular OCI layout files into a separate scan directory; never execute
      # archive contents or add extracted files to the uploaded review artifact.
      - name: safely prepare OCI layout for scanning
        env:
          COMPONENT: ${{ matrix.component }}
        shell: python
        run: |
          import os
          import pathlib
          import re
          import shutil
          import tarfile

          component = os.environ["COMPONENT"]
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          archive = root / "storage-display" / f"{component}.oci.tar"
          destination = root / "storage-scan" / component
          destination.mkdir(parents=True)
          seen = set()
          with tarfile.open(archive) as tar:
              for member in tar:
                  name = member.name.removeprefix("./")
                  if member.isdir():
                      if name not in ("", ".", "blobs", "blobs/sha256"):
                          raise RuntimeError("Unexpected OCI directory")
                      continue
                  if not member.isfile() or name in seen:
                      raise RuntimeError("Duplicate or nonregular OCI entry")
                  if name not in ("index.json", "oci-layout") and not re.fullmatch(
                      r"blobs/sha256/[0-9a-f]{64}", name
                  ):
                      raise RuntimeError("Unsafe OCI archive path")
                  seen.add(name)
                  target = destination / name
                  target.parent.mkdir(parents=True, exist_ok=True)
                  source = tar.extractfile(member)
                  if source is None:
                      raise RuntimeError("Missing OCI file contents")
                  with target.open("wb") as output:
                      shutil.copyfileobj(source, output)
          if not {"index.json", "oci-layout"}.issubset(seen):
              raise RuntimeError("Incomplete OCI layout")
      - name: scan exact built image before artifact upload
        env:
          COMPONENT: ${{ matrix.component }}
        shell: bash
        run: |
          set -euo pipefail
          trivy image --input "$RUNNER_TEMP/storage-scan/$COMPONENT" \
            --platform linux/amd64 --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 --no-progress
      - name: record successful vulnerability policy in review metadata
        env:
          COMPONENT: ${{ matrix.component }}
        shell: python
        run: |
          import json
          import os
          import pathlib

          path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "storage-display" / (
              os.environ["COMPONENT"] + ".metadata.json"
          )
          metadata = json.loads(path.read_text())
          metadata["vulnerabilityScan"] = {
              "scanner": "Trivy",
              "version": "0.74.0",
              "platform": "linux/amd64",
              "severity": ["HIGH", "CRITICAL"],
              "ignoreUnfixed": True,
              "result": "passed",
          }
          path.write_text(json.dumps(metadata, indent=2) + "\n")
      - name: upload unsigned review artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: storage-display-${{ matrix.component }}-amd64-${{ github.sha }}
          path: ${{ runner.temp }}/storage-display/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
