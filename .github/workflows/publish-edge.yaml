name: publish reviewed storage display images

# REVIEW ONLY until the owner approves publication and this new keyless identity.
# Install only on delivery/openebs-storage-capacity, replacing the existing
# dispatch-capable path. No push/PR/tag trigger; never merge this into upstream.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful storage-display-build artifact run ID
        required: true
        type: string
      ci_run_id:
        description: Successful separate ci.yaml test run ID for the same PR/head
        required: true
        type: string
      source_merge_sha:
        description: Exact PR merge SHA recorded in the reviewed OCI metadata
        required: true
        type: string
      head_sha:
        description: Exact reviewed fix branch head SHA
        required: true
        type: string
      delivery_sha:
        description: Exact approved delivery branch commit containing this workflow
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: storage-display-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Baylem/Gameplane' && github.ref == 'refs/heads/delivery/openebs-storage-capacity'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
    env:
      REPOSITORY: Baylem/Gameplane
      BASE_SHA: 657462a4d8ec916305b8499995e98c026fc1157c
      BUILD_RUN: ${{ inputs.run_id }}
      CI_RUN: ${{ inputs.ci_run_id }}
      SOURCE_SHA: ${{ inputs.source_merge_sha }}
      HEAD_SHA: ${{ inputs.head_sha }}
      DELIVERY_SHA: ${{ inputs.delivery_sha }}
      DELIVERY_REF: refs/heads/delivery/openebs-storage-capacity
      CERT_IDENTITY: https://github.com/Baylem/Gameplane/.github/workflows/publish-edge.yaml@refs/heads/delivery/openebs-storage-capacity
    steps:
      - name: verify exact reviewed runs, PR base/head and delivery identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64
          import hashlib
          import json
          import os
          import pathlib
          import re
          import urllib.request

          def require(condition, message):
              if not condition:
                  raise RuntimeError(message)

          def api(path):
              request = urllib.request.Request(
                  "https://api.github.com/repos/Baylem/Gameplane/" + path,
                  headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                           "Accept": "application/vnd.github+json",
                           "X-GitHub-Api-Version": "2022-11-28"},
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          for name in ("SOURCE_SHA", "HEAD_SHA", "DELIVERY_SHA"):
              require(re.fullmatch(r"[0-9a-f]{40}", os.environ[name]), "Invalid SHA input")
          for name in ("BUILD_RUN", "CI_RUN"):
              require(re.fullmatch(r"[1-9][0-9]*", os.environ[name]), "Invalid run ID")
          require(os.environ["GITHUB_SHA"] == os.environ["DELIVERY_SHA"], "Unapproved delivery commit")
          require(os.environ["GITHUB_REF"] == os.environ["DELIVERY_REF"], "Wrong delivery ref")
          runs = []
          for name, workflow in (("BUILD_RUN", "storage-display-build.yaml"), ("CI_RUN", "ci.yaml")):
              run = api("actions/runs/" + os.environ[name])
              require(run["repository"]["full_name"] == "Baylem/Gameplane", "Wrong run repository")
              require(run["head_repository"]["full_name"] == "Baylem/Gameplane", "Wrong head repository")
              require(run["path"] == ".github/workflows/" + workflow, "Wrong workflow")
              require(run["status"] == "completed" and run["conclusion"] == "success", "Run not successful")
              require(run["event"] == "pull_request", "Run must be PR-triggered")
              require(run["head_sha"] == os.environ["HEAD_SHA"], "Wrong run head SHA")
              require(run["head_branch"] == "fix/openebs-storage-capacity", "Wrong source branch")
              require(len(run["pull_requests"]) == 1, "Expected one source PR")
              require(run["pull_requests"][0]["base"]["sha"] == os.environ["BASE_SHA"], "Run used another baseline SHA")
              require(run["pull_requests"][0]["head"]["sha"] == os.environ["HEAD_SHA"], "Run used another PR head SHA")
              pr = api("pulls/" + str(run["pull_requests"][0]["number"]))
              require(pr["base"]["repo"]["full_name"] == "Baylem/Gameplane", "Wrong base repository")
              require(pr["base"]["ref"] == "review/v0.4.1-storage-base", "Wrong baseline ref")
              require(pr["base"]["sha"] == os.environ["BASE_SHA"], "Baseline moved")
              require(pr["head"]["repo"]["full_name"] == "Baylem/Gameplane", "Wrong PR head repository")
              require(pr["head"]["sha"] == os.environ["HEAD_SHA"], "PR head moved; review a fresh run")
              runs.append(run)
          require(runs[0]["pull_requests"][0]["number"] == runs[1]["pull_requests"][0]["number"], "Runs belong to different PRs")
          commit = api("commits/" + os.environ["SOURCE_SHA"])
          require([p["sha"] for p in commit["parents"]] == [os.environ["BASE_SHA"], os.environ["HEAD_SHA"]], "Wrong PR merge parents")
          # Bind metadata to the successful build attempt, including re-runs.
          receipt = {"buildRun": runs[0]["id"], "buildAttempt": runs[0]["run_attempt"],
                     "ciRun": runs[1]["id"], "sourceMergeSha": os.environ["SOURCE_SHA"],
                     "headSha": os.environ["HEAD_SHA"], "deliverySha": os.environ["DELIVERY_SHA"]}
          receipt["dockerfileSha256"] = {}
          for component in ("api", "web"):
              content = api("contents/" + component + "/Dockerfile?ref=" + os.environ["SOURCE_SHA"])
              require(content["encoding"] == "base64", "Unsupported source encoding")
              receipt["dockerfileSha256"][component] = hashlib.sha256(base64.b64decode(content["content"])).hexdigest()
          directory = pathlib.Path(os.environ["RUNNER_TEMP"]) / "storage-publication"
          directory.mkdir()
          (directory / "run-receipt.json").write_text(json.dumps(receipt, indent=2) + "\n")
      - name: download only the two reviewed build artifacts
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          repository: Baylem/Gameplane
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          pattern: storage-display-*-amd64-${{ inputs.source_merge_sha }}
          path: ${{ runner.temp }}/storage-publication/artifacts
          merge-multiple: false
      - name: verify metadata, archive checksums and complete OCI graphs
        shell: python
        run: |
          import hashlib
          import json
          import os
          import pathlib
          import re
          import shutil
          import tarfile

          def require(condition, message):
              if not condition:
                  raise RuntimeError(message)

          def digest_bytes(data):
              return "sha256:" + hashlib.sha256(data).hexdigest()

          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "storage-publication"
          receipt = json.loads((root / "run-receipt.json").read_text())
          artifacts = root / "artifacts"
          expected = {f"storage-display-{c}-amd64-{os.environ['SOURCE_SHA']}" for c in ("api", "web")}
          require({p.name for p in artifacts.iterdir()} == expected, "Unexpected/missing artifact")
          images = {}
          for component in ("api", "web"):
              directory = artifacts / f"storage-display-{component}-amd64-{os.environ['SOURCE_SHA']}"
              require({p.name for p in directory.iterdir()} == {f"{component}.oci.tar", f"{component}.oci.tar.sha256", f"{component}.metadata.json"}, "Unexpected artifact files")
              metadata = json.loads((directory / f"{component}.metadata.json").read_text())
              for key, expected_value in {
                  "component": component, "platform": "linux/amd64", "sourceRepository": "Baylem/Gameplane",
                  "sourceMergeSha": os.environ["SOURCE_SHA"], "pullRequestHeadSha": os.environ["HEAD_SHA"],
                  "pullRequestBaseSha": os.environ["BASE_SHA"], "runId": str(receipt["buildRun"]),
                  "runAttempt": str(receipt["buildAttempt"]), "registryPublished": False, "signed": False,
                  "buildVersion": "0.4.1-storage-" + os.environ["SOURCE_SHA"][:7],
              }.items():
                  require(metadata.get(key) == expected_value, "Artifact metadata mismatch: " + key)
              require(metadata.get("dockerfileSha256") == receipt["dockerfileSha256"][component], "Wrong source Dockerfile hash")
              require(metadata.get("vulnerabilityScan") == {
                  "scanner": "Trivy", "version": "0.74.0", "platform": "linux/amd64",
                  "severity": ["HIGH", "CRITICAL"], "ignoreUnfixed": True, "result": "passed",
              }, "Missing or mismatched pre-review vulnerability scan")
              archive = directory / f"{component}.oci.tar"
              with archive.open("rb") as stream:
                  checksum = hashlib.file_digest(stream, "sha256").hexdigest()
              require(checksum == metadata["archiveSha256"], "Archive metadata checksum mismatch")
              require((directory / f"{component}.oci.tar.sha256").read_text() == f"{checksum}  {archive.name}\n", "Archive checksum file mismatch")
              layout = root / component
              layout.mkdir()
              with tarfile.open(archive) as tar:
                  seen = set()
                  for member in tar:
                      name = member.name.removeprefix("./")
                      if member.isdir():
                          require(name in ("", ".", "blobs", "blobs/sha256"), "Unexpected OCI directory")
                          continue
                      require(member.isfile() and name not in seen, "Duplicate or nonregular OCI entry")
                      require(name in ("index.json", "oci-layout") or re.fullmatch(r"blobs/sha256/[0-9a-f]{64}", name), "Unsafe OCI archive path")
                      seen.add(name)
                      target = layout / name
                      target.parent.mkdir(parents=True, exist_ok=True)
                      source = tar.extractfile(member)
                      require(source is not None, "Missing OCI entry")
                      with target.open("wb") as output:
                          shutil.copyfileobj(source, output)
              require(json.loads((layout / "oci-layout").read_text())["imageLayoutVersion"] == "1.0.0", "Wrong OCI layout")
              index = json.loads((layout / "index.json").read_text())
              require(index["manifests"] == metadata["ociDescriptors"] and len(index["manifests"]) == 1, "OCI descriptors differ")
              descriptor = index["manifests"][0]
              digest = descriptor["digest"]
              require(digest == metadata["buildDigest"], "Build/root digest mismatch")
              visited = set()
              runtime_configs = []

              def visit(desc):
                  value = desc["digest"]
                  require(re.fullmatch(r"sha256:[0-9a-f]{64}", value), "Unsupported OCI digest")
                  path = layout / "blobs/sha256" / value.split(":")[1]
                  require(path.is_file() and path.stat().st_size == desc["size"], "Missing/wrong-size OCI blob")
                  with path.open("rb") as stream:
                      require("sha256:" + hashlib.file_digest(stream, "sha256").hexdigest() == value, "OCI blob digest mismatch")
                  if value in visited:
                      return
                  visited.add(value)
                  media = desc["mediaType"]
                  if media in ("application/vnd.oci.image.index.v1+json", "application/vnd.docker.distribution.manifest.list.v2+json"):
                      document = json.loads(path.read_text())
                      for child in document["manifests"]:
                          visit(child)
                  elif media in ("application/vnd.oci.image.manifest.v1+json", "application/vnd.docker.distribution.manifest.v2+json"):
                      document = json.loads(path.read_text())
                      visit(document["config"])
                      for child in document["layers"]:
                          visit(child)
                  elif media in ("application/vnd.oci.image.config.v1+json", "application/vnd.docker.container.image.v1+json"):
                      document = json.loads(path.read_text())
                      if document.get("os") != "unknown":
                          require(document.get("os") == "linux" and document.get("architecture") == "amd64", "Non-amd64 runtime image")
                          labels = document.get("config", {}).get("Labels", {})
                          require(labels.get("org.opencontainers.image.revision") == os.environ["SOURCE_SHA"], "Wrong image source label")
                          runtime_configs.append(value)

              visit(descriptor)
              require(len(runtime_configs) == 1, "Expected exactly one amd64 runtime image")
              images[component] = {"digest": digest, "archiveSha256": checksum}
          receipt["images"] = images
          (root / "run-receipt.json").write_text(json.dumps(receipt, indent=2) + "\n")
      # Trusted tools/policy come from the exact reviewed delivery commit, not
      # from downloaded image archives. Nothing from an archive is executed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.delivery_sha }}
          persist-credentials: false
      - name: install existing checksum-pinned Trivy 0.74.0
        uses: ./.github/actions/install-trivy
      - name: scan both local images before any registry write
        shell: bash
        run: |
          set -euo pipefail
          for component in api web; do
            trivy image --input "$RUNNER_TEMP/storage-publication/$component" \
              --platform linux/amd64 --severity HIGH,CRITICAL --ignore-unfixed \
              --exit-code 1 --no-progress
          done
      - uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
        with:
          version: 1.3.6
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.2
      - name: publish by digest, keyless sign and verify, then attach exact source tags
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          cosign initialize
          for component in api web; do
            image="ghcr.io/baylem/gameplane/$component"
            digest=$(python3 -c 'import json,os,sys; print(json.load(open(os.environ["RUNNER_TEMP"]+"/storage-publication/run-receipt.json"))["images"][sys.argv[1]]["digest"])' "$component")
            tag="storage-$SOURCE_SHA"
            # Create the package by immutable digest before enumerating its
            # tags. First-use authorization errors are never treated as absence.
            oras cp --from-oci-layout "$RUNNER_TEMP/storage-publication/$component@$digest" "$image@$digest"
            test "$(oras resolve "$image@$digest")" = "$digest"
            check_source_tag() {
              oras repo tags "$image" --format json > "$RUNNER_TEMP/tags.json"
              present=$(python3 -c 'import json,os,sys; value=json.load(open(os.environ["RUNNER_TEMP"]+"/tags.json")); assert isinstance(value,dict) and set(value)=={"tags"} and isinstance(value["tags"],list) and all(isinstance(tag,str) for tag in value["tags"]); print("yes" if sys.argv[1] in value["tags"] else "no")' "$tag")
              if [ "$present" = yes ]; then
                existing=$(oras resolve "$image:$tag")
                test "$existing" = "$digest" || { echo 'Refusing to overwrite a source tag with another digest'; exit 1; }
              fi
            }
            check_source_tag
            cosign sign --yes --new-bundle-format=false --use-signing-config=false \
              -a "sourceMergeSha=$SOURCE_SHA" -a "headSha=$HEAD_SHA" \
              -a "buildRun=$BUILD_RUN" -a "ciRun=$CI_RUN" "$image@$digest"
            cosign verify --new-bundle-format=false \
              --certificate-identity "$CERT_IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-github-workflow-repository Baylem/Gameplane \
              --certificate-github-workflow-ref "$DELIVERY_REF" \
              --certificate-github-workflow-sha "$DELIVERY_SHA" \
              --certificate-github-workflow-trigger workflow_dispatch \
              -a "sourceMergeSha=$SOURCE_SHA" -a "headSha=$HEAD_SHA" \
              -a "buildRun=$BUILD_RUN" -a "ciRun=$CI_RUN" "$image@$digest" \
              > "$RUNNER_TEMP/storage-publication/$component-verification.json"
            # Recheck immediately before tagging. This dedicated workflow is
            # serialized; registry tag updates are not atomic across other writers.
            check_source_tag
            oras tag "$image@$digest" "$tag"
            test "$(oras resolve "$image:$tag")" = "$digest"
            printf '%s@%s (%s)\n' "$image" "$digest" "$tag" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: upload public publication receipt and signature verification
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: storage-display-publication-${{ inputs.source_merge_sha }}
          path: |
            ${{ runner.temp }}/storage-publication/run-receipt.json
            ${{ runner.temp }}/storage-publication/*-verification.json
          if-no-files-found: error
          retention-days: 30
