name: portable paths

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: portable-paths-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check filename fixtures
        run: python3 hack/test-check-portable-paths.py
      - name: Check all tracked filenames
        run: python3 hack/check-portable-paths.py
