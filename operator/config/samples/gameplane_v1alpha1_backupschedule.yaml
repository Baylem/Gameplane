apiVersion: gameplane.local/v1alpha1
kind: BackupSchedule
metadata:
  name: smp-01-every-6h
  namespace: gameplane-games
spec:
  serverRef:
    name: smp-01
  schedule: "0 */6 * * *"
  # See gameplane_v1alpha1_backup.yaml: repoRef.key is unused by the
  # operator, which always reads the "repo"/"password" keys off the
  # named Secret.
  repoRef:
    name: gameplane-backup-repo
    key: repo
  strategy: restic-snapshot
  quiesce: true
  retention:
    keepLast: 12
    keepDaily: 7
    keepWeekly: 4
  concurrencyPolicy: Forbid
